<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>GGG MASTER V6.11 - NO-REDIRECT ENGINE</title>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b0e11; --card: #161b22; --accent: #f1c40f; --green: #2ecc71; --blue: #3498db; --text: #eaecef; --nav: #161b22; --btn: #2b3139; --glass: rgba(255, 255, 255, 0.05); }
        .light-mode { --bg: #f5f7f9; --card: #ffffff; --accent: #d4af37; --green: #27ae60; --blue: #2980b9; --text: #1e2329; --nav: #ffffff; --btn: #e4e6eb; --glass: rgba(0, 0, 0, 0.05); }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; transition: 0.3s; overflow-x: hidden; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: url('https://i.ibb.co/FbrzsJ9J/Screenshot-2026-04-10-17-14-06-636.jpg') center/cover no-repeat; opacity: 0.15; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: var(--card); align-items: center; border-bottom: 1px solid var(--glass); position: sticky; top: 0; z-index: 1000; }
        .screen { display: none; flex-direction: column; align-items: center; padding: 15px; width: 100%; box-sizing: border-box; animation: fadeIn 0.4s; }
        .active-screen { display: flex; }
        
        .lobby-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
        .game-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid var(--glass); }
        .game-card.featured { border: 2px solid var(--accent); }
        .visual-area { width: 100%; height: 180px; overflow: hidden; position: relative; }
        .game-bg-img { width: 100%; height: 100%; object-fit: cover; }
        .game-details { padding: 15px; text-align: center; }

        .control-panel { background: var(--card); width: 100%; max-width: 400px; padding: 20px; border-radius: 25px; border: 1px solid var(--glass); box-sizing: border-box; }
        .stat-item-blue { background: rgba(52, 152, 219, 0.15); padding: 10px; border-radius: 12px; border: 1px solid var(--blue); text-align: center; }
        .stat-item-blue b { color: var(--blue); font-size: 16px; }
        .btn-green { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--green); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        
        .social-join-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; text-decoration: none; font-size: 14px; }
        .bet-slider { width: 100%; height: 8px; border-radius: 5px; background: #334155; outline: none; -webkit-appearance: none; accent-color: var(--accent); }
        .side-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        .side-btn { padding: 12px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: white; font-weight: bold; cursor: pointer; }
        .side-btn.active { background: var(--accent); color: black; border-color: var(--accent); }
        .bonus-box { background: rgba(52, 152, 219, 0.1); padding: 12px; border-radius: 15px; text-align: center; border: 1px solid var(--blue); font-size: 12px; }
        .bonus-box.eligible { border: 2px solid var(--green); box-shadow: 0 0 10px var(--green); }
        
        .footer { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--nav); display: flex; border-top: 1px solid var(--glass); z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #848e9c; font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .history-table { width: 100%; max-width: 400px; border-collapse: collapse; font-size: 12px; margin-top: 20px; background: var(--card); border-radius: 15px; overflow: hidden; }
        .history-table td { padding: 12px; text-align: center; border-top: 1px solid var(--glass); }
        .status-checking { color: var(--accent); font-weight: bold; animation: pulse 1s infinite; }
        .status-win { color: var(--green); font-weight: bold; }
        .status-lose { color: #ff4757; font-weight: bold; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="bg-overlay"></div>
<div class="header">
    <div id="wallet"></div>
    <div onclick="toggleMode()" style="color:var(--accent); font-size:20px; cursor:pointer;"><i class="fas fa-moon" id="theme-icon"></i></div>
</div>

<div id="lobby-screen" class="screen active-screen">
    <div class="lobby-container">
        <div class="game-card featured">
            <div class="visual-area">
                <img src="https://i.ibb.co/HfV9cGL0/IMG-20260407-222820.png" class="game-bg-img">
            </div>
            <div class="game-details">
                <h2 style="margin: 0 0 5px 0; color: var(--accent);">GOLDEN LOW-HIGH</h2>
                <p style="font-size: 12px; opacity: 0.7; margin: 0 0 15px 0;">Predict low or high numbers to win instantly.</p>
                <button class="btn-green" style="font-size:15px;" onclick="showScreen('play-screen')">PLAY NOW</button>
            </div>
        </div>
    </div>
</div>
<div id="play-screen" class="screen">
    <div class="visual-area" style="border-radius: 20px; border: 2px solid var(--accent); margin-bottom: 15px; max-width:400px;">
        <img src="https://i.ibb.co/JjLp1zJ8/file-00000000740871fa81847d4e88a5158b.png" class="game-bg-img">
    </div>
    <div class="control-panel">
        <div style="font-size:28px; font-weight:900; text-align:center; color:var(--accent);"><span id="display-amt">0.10</span> <small>TON</small></div>
        <input type="range" min="0.1" max="2.1" step="0.1" value="0.1" class="bet-slider" id="amount-slider" oninput="updateBetUI(this.value)">
        <div class="side-btns">
            <button id="lowBtn" class="side-btn active" onclick="setSide(true)">LOW (1-49)</button>
            <button id="highBtn" class="side-btn" onclick="setSide(false)">HIGH (50-98)</button>
        </div>
        <button class="btn-green" style="height:55px; font-size:18px;" id="betBtn" onclick="placeBet()">PLACE BET</button>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
            <div class="stat-item-blue"><span>PENDING WIN</span><br><b id="pending">0.00</b></div>
            <button onclick="claimWin()" class="btn-green" style="background:var(--green);">CLAIM WIN</button>
        </div>
        <div style="text-align:center; font-size:10px; margin-top:10px; opacity:0.6;">Est. Payout: <span id="est-payout">0.185</span> | Gas: 0.05 TON</div>
    </div>
    <table class="history-table"><tbody id="historyList"></tbody></table>
</div>

<div id="invite-screen" class="screen">
    <div class="control-panel" style="text-align:center;">
        <i class="fas fa-users" style="font-size:40px; color:var(--accent);"></i>
        <h3 style="margin:10px 0;">REFERRAL SYSTEM</h3>
        <div id="refLink" style="font-size:11px; background:rgba(0,0,0,0.3); padding:10px; border-radius:10px; word-break:break-all; margin-bottom:10px;">Connect wallet</div>
        <button id="copyBtn" onclick="copyLink()" class="btn-green" style="background:var(--accent); color:black;">COPY LINK</button>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
            <div class="stat-item-blue"><span>INVITED</span><br><b id="ref-count">0</b></div>
            <div class="stat-item-blue"><span>5% EARN</span><br><b id="ref-bal">0.00</b></div>
        </div>
        <button onclick="withdrawRef()" class="btn-green" style="margin-top:10px;">CLAIM REFERRAL</button>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:15px;">
            <div class="bonus-box" id="tier1"><b>10 Refs</b><br><small>0.3 TON</small></div>
            <div class="bonus-box" id="tier2"><b>30 Refs</b><br><small>0.6 TON</small></div>
            <div class="bonus-box" id="tier3"><b>50 Refs</b><br><small>0.6 TON</small></div>
            <div class="bonus-box" id="tier4"><b>100 Refs</b><br><small>1.5 TON</small></div>
        </div>
        <button onclick="claimBonus()" class="btn-green" style="margin-top:15px; background:var(--blue);">CLAIM VIP BONUS</button>
    </div>
</div>

<div class="footer">
    <div class="nav-item active" onclick="showScreen('lobby-screen')"><i class="fas fa-home"></i>Lobby</div>
    <div class="nav-item" onclick="showScreen('play-screen')"><i class="fas fa-gamepad"></i>Play</div>
    <div class="nav-item" onclick="showScreen('invite-screen')"><i class="fas fa-gift"></i>Invite</div>
</div>

<script>
    // FIXED TO MATCH YOUR CONTRACT DIRECTLY
    const CONTRACT_ADDR = "EQA1kZk2XgLRH9CCLT5mef5h9_s3QcDv9-DPuCzbGgpsDmnn";
    const API = "https://toncenter.com/api/v2";
    const tonweb = new TonWeb();
    let userAddress = null; let isSideLow = true; let lastKnownPending = 0; let gameHistory = [];

    // LEGACY REDIRECT PROTECTOR: Keeps users inside the app exactly like V3.2
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://ggg121314.github.io/Golden-Game/tonconnect-manifest.json",
        buttonRootId: "wallet"
    });

    tonConnectUI.onStatusChange(w => { if (w) { userAddress = w.account.address; updateRefUI(); loadData(); } });

    if(localStorage.getItem('ggg_history_v6')) {
        try { gameHistory = JSON.parse(localStorage.getItem('ggg_history_v6')); } catch(e){}
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
        document.querySelectorAll('.nav-item').forEach(n => {
            const tabName = n.innerText.toLowerCase().trim();
            n.classList.toggle('active', id.startsWith(tabName));
        });
    }

    function toggleMode() {
        document.body.classList.toggle('light-mode');
        const icon = document.getElementById('theme-icon');
        icon.classList.toggle('fa-moon'); icon.classList.toggle('fa-sun');
    }

    function updateBetUI(val) {
        document.getElementById('display-amt').innerText = parseFloat(val).toFixed(2);
        document.getElementById('est-payout').innerText = (parseFloat(val) * 1.85).toFixed(3);
    }

    function setSide(s) { isSideLow = s; document.getElementById('lowBtn').classList.toggle('active', s); document.getElementById('highBtn').classList.toggle('active', !s); }

    function updateRefUI() {
        if (!userAddress) return;
        const base = window.location.origin + window.location.pathname;
        document.getElementById("refLink").innerText = base + "?ref=" + userAddress;
    }

    function copyLink() {
        navigator.clipboard.writeText(document.getElementById("refLink").innerText);
        const btn = document.getElementById("copyBtn"); btn.innerHTML = '<i class="fas fa-check"></i> COPIED';
        setTimeout(() => { btn.innerText = "COPY LINK"; }, 2000);
    }

    // TELEGRAM BOT REFERRAL EXTRACTION HACK: Pulls ref even inside pure Bot starts
    function getReferrer() {
        const params = new URLSearchParams(window.location.search);
        let ref = params.get('ref');
        if (!ref && window.Telegram && window.Telegram.WebApp) {
            const initDataUnsafe = window.Telegram.WebApp.initDataUnsafe;
            if (initDataUnsafe && initDataUnsafe.start_param) {
                ref = initDataUnsafe.start_param;
            }
        }
        return ref;
    }

    async function fetchGetter(method, isCount = false) {
        if (!userAddress) return "0";
        try {
            const addr = new TonWeb.utils.Address(userAddress);
            const cell = new TonWeb.boc.Cell(); cell.bits.writeAddress(addr);
            const b64 = TonWeb.utils.bytesToBase64(await cell.toBoc(false));
            const r = await fetch(`${API}/runGetMethod`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ "address": CONTRACT_ADDR, "method": method, "stack": [["tvm.Slice", b64]] })
            });
            const d = await r.json();
            const rawVal = d.result?.stack?.[0]?.[1];
            if(!rawVal) return "0";
            if(isCount) return BigInt(rawVal).toString(); // Count reading fix
            return TonWeb.utils.fromNano(BigInt(rawVal).toString());
        } catch(e) { return "0"; }
    }

    async function loadData() {
        if (!userAddress) return;
        const p = await fetchGetter("pendingWin", false);
        const rBal = await fetchGetter("referralBalance", false);
        const countStr = await fetchGetter("referralCount", true);
        const count = parseInt(countStr) || 0;
        
        lastKnownPending = parseFloat(p);
        document.getElementById('pending').innerText = lastKnownPending.toFixed(3);
        document.getElementById('ref-bal').innerText = parseFloat(rBal).toFixed(3);
        document.getElementById('ref-count').innerText = count;

        document.getElementById('tier1').classList.toggle('eligible', count >= 10);
        document.getElementById('tier2').classList.toggle('eligible', count >= 30);
        document.getElementById('tier3').classList.toggle('eligible', count >= 50);
        document.getElementById('tier4').classList.toggle('eligible', count >= 100);
    }

    async function placeBet() {
        if (!userAddress) return alert("Connect Wallet!");
        const val = document.getElementById('amount-slider').value;
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        try {
            const total = TonWeb.utils.toNano(val).add(TonWeb.utils.toNano("0.05"));
            
            // ANTI-REDIRECT CELL BUILD: Re-architected based on Legacy V3.2 to completely stop browser bounces
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0xAAAABBBB, 32);
            cell.bits.writeBit(isSideLow);
            cell.bits.writeCoins(TonWeb.utils.toNano(val)); // Exact 1.85x Payout Matcher

            const ref = getReferrer();
            if (ref) cell.bits.writeAddress(new TonWeb.utils.Address(ref)); else cell.bits.writeAddress(null);

            const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));
            
            const gameId = Date.now();
            const gameEntry = { id: gameId, time: timeStr, amount: val, side: isSideLow?'LOW':'HIGH', status: 'CHECKING', statusClass: 'status-checking' };
            
            // STRICT 10-ITEM HISTORY LIMITER
            gameHistory.push(gameEntry);
            if (gameHistory.length > 10) { gameHistory = gameHistory.slice(-10); }
            localStorage.setItem('ggg_history_v6', JSON.stringify(gameHistory));
            renderHistory();
            
            const beforePending = lastKnownPending;

            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: CONTRACT_ADDR, amount: total.toString(), payload: payload }]
            });

            let checks = 0;
            const checkInterval = setInterval(async () => {
                await loadData(); checks++;
                if (lastKnownPending > beforePending) {
                    gameEntry.status = "WIN 🟢"; gameEntry.statusClass = "status-win";
                    localStorage.setItem('ggg_history_v6', JSON.stringify(gameHistory));
                    renderHistory(); clearInterval(checkInterval);
                } else if (checks >= 10) {
                    gameEntry.status = "LOSE 🔴"; gameEntry.statusClass = "status-lose";
                    localStorage.setItem('ggg_history_v6', JSON.stringify(gameHistory));
                    renderHistory(); clearInterval(checkInterval);
                }
            }, 2000);

        } catch (e) { alert("Transaction Cancelled"); }
    }

    function renderHistory() {
        const el = document.getElementById("historyList");
        if (gameHistory.length === 0) { el.innerHTML = '<tr><td style="padding:20px; opacity:0.5;">No history yet</td></tr>'; return; }
        
        // Final UI defense to render only 10 items maximum
        const displayList = gameHistory.slice(-10);
        el.innerHTML = displayList.slice().reverse().map(g => `
            <tr><td>${g.time}</td><td><b>${g.amount}</b></td><td>${g.side}</td><td><span class="${g.statusClass}">${g.status}</span></td></tr>
        `).join("");
    }

    async function claimWin() {
        const cell = new TonWeb.boc.Cell(); cell.bits.writeUint(0, 32); cell.bits.writeString("Claim");
        await sendContractTx(cell);
    }
    async function withdrawRef() {
        const cell = new TonWeb.boc.Cell(); cell.bits.writeUint(0, 32); cell.bits.writeString("WithdrawRef");
        await sendContractTx(cell);
    }
    async function claimBonus() {
        const cell = new TonWeb.boc.Cell(); cell.bits.writeUint(0, 32); cell.bits.writeString("ClaimBonus");
        await sendContractTx(cell);
    }
    async function sendContractTx(cell) {
        try {
            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: CONTRACT_ADDR, amount: TonWeb.utils.toNano("0.05").toString(), payload: TonWeb.utils.bytesToBase64(await cell.toBoc(false)) }]
            });
        } catch(e) {}
    }

    setInterval(loadData, 10000);
    renderHistory();
</script>
</body>
</html>
